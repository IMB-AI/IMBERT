# ============================================================================
#  IMBERT v1.0 -- masked-language-model pre-training configuration
#
#  Run with:   python pretrain.py --config pretrain_config.ini
#
#  Only the paths in [PreTrain] and [PreTrain][[Dataset]] normally need to be
#  edited.  The values under [Model] describe the released IMBERT v1.0 encoder;
#  changing them produces a model whose weights are NOT compatible with the
#  published checkpoint.
# ============================================================================

[COMMON]
task = PreTrain
add_special_token = False

[PreTrain]
# CUDA device ids, one training process per id.
# Use `gpu_ids = cpu` (or leave a machine without CUDA) to run on CPU.
gpu_ids = 0, 1, 2, 3, 4, 5, 6, 7
test_name = IMBERT_v1.0_pretrain

result_dir = ./results/PreTrain/%(test_name)s
attention_weights_dir = %(result_dir)s/attention_weights
log_dir = %(result_dir)s/logs
loss_dir = %(result_dir)s/losses
model_checkpoints_dir = %(result_dir)s/model_checkpoints
prediction_status_dir = %(result_dir)s/prediction_status

# Save a checkpoint and dump per-sample predictions every N epochs.
prediction_checkpoint = 1000

[[Dataset]]
dataset_dir = ./data
version = 20250728

# Pathway abundance-rank tables (rows: pathways, columns: samples).
Training_dataset_path = %(dataset_dir)s/train_abundances.tsv
Validation_dataset_path = %(dataset_dir)s/validation_abundances.tsv

# Pathway vocabulary: one `id<TAB>pathway` line per token.
#
#   * Leave EMPTY to build a new vocabulary from the row order of the training
#     table.  Only do this when pre-training a model from scratch.
#   * Set it to the released vocabulary when you want to reproduce or reuse the
#     published IMBERT v1.0 weights -- the id of a pathway is baked into the
#     word-embedding matrix and cannot be re-derived from a different table.
vocab_path = ../../imbert_v1.0_pathway_vocab.tsv

[[hyperparams]]
max_epochs = 60001
# Total batch size; it is divided evenly across the training processes.
batch_size = 512

[Model]
[[hyperparams]]
hidden_size = 256
num_hidden_layers = 12
num_attention_heads = 4
intermediate_size = 512
hidden_act = gelu
hidden_dropout_prob = 0.1
attention_probs_dropout_prob = 0.1
max_position_embeddings = 460
type_vocab_size = 2
initializer_range = 0.02
# IMBERT v1.0 was trained without bias terms in the linear layers.
model_bias = False

[Training]
[[hyperparams]]
learning_rate = 0.00001
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_weight_decay = 0.01
log_freq = 10
warmup_steps = 10000
