# ============================================================================
#  IMBERT v1.0 -- fine-tuning configuration (binary phenotype classification)
#
#  Run with:  python finetune_hvsp_cv.py        --config finetune_config.ini
#             python finetune_each_cohort_cv.py --config finetune_config.ini
#             python finetune_multi_cohort_cv.py --config finetune_config.ini
#
#  [PreTrain] tells the scripts which released checkpoint and vocabulary to
#  start from; [Model] must describe that checkpoint exactly.
# ============================================================================

[COMMON]
task = FineTuning
add_special_token = False

# --------------------------------------------------------------------------
#  Pre-trained model to start from
# --------------------------------------------------------------------------
[PreTrain]
test_name = IMBERT_v1.0_pretrain

# Released checkpoint to fine-tune from. BOTH file types work:
#   imbert_v1.0_pretrained.pt              portable release file, 29.5 MB
#   imbert_v1.0_pretrained_epoch15000.ckp  raw training checkpoint, 97.5 MB
# Neither is stored in git -- download one from the release, or build the .pt
# from the .ckp with IMBERT-PT_v1.0/BERT/export_checkpoint.py.
checkpoint_path = ../../imbert_v1.0_pretrained.pt

# Alternative to checkpoint_path: rebuild the file name from a pre-training run
# directory, `test_name` and [FineTuning] weight_immigration_epoch.
model_checkpoints_dir = ../../IMBERT-PT_v1.0/BERT/results/PreTrain/%(test_name)s/model_checkpoints

[[Dataset]]
# Vocabulary released together with the checkpoint. REQUIRED: the id of a
# pathway is baked into the word-embedding matrix, so it cannot be re-derived
# from a fine-tuning table.
vocab_path = ../../imbert_v1.0_pathway_vocab.tsv

# --------------------------------------------------------------------------
#  Fine-tuning run
# --------------------------------------------------------------------------
[FineTuning]
# CUDA device ids, one training process per id.
# Use `gpu_ids = cpu` (or run without CUDA) to fine-tune on CPU.
gpu_ids = 0, 1, 2, 3
test_name = IMBERT_v1.0_finetune

# Only used when checkpoint_path above is left empty.
weight_immigration_epoch = 15000

default_dir = ./results/FineTuning
result_dir = %(default_dir)s/%(test_name)s
etc_dir = %(result_dir)s/etc
log_dir = %(result_dir)s/logs
loss_dir = %(result_dir)s/losses
model_checkpoints_dir = %(result_dir)s/model_checkpoints
prediction_status_dir = %(result_dir)s/prediction_status

[[Dataset]]
dataset_dir = ./data
version = 20250728

# Pathway abundance-rank table produced by Preprocessing/preprocessing.py.
total_samples_rank_path = %(dataset_dir)s/preprocessed_bert_input_format/%(version)s/DL_input_%(version)s.tsv
# Sample metadata: Run_Id, Study_Accession, Subject_Health_Status, Phenotype, DL_Group
sample_information_path = %(dataset_dir)s/raw/DL_input_info_%(version)s.txt

# cross_validation: random train/validation splits inside the cohort(s)
# cross_cohort   : train on train_bioprj, validate on valid_bioprj
pred_type = cross_validation
cv_ratio = 0.7
n_sampling_times = 100

# The driver scripts overwrite these per cohort; the values below are only the
# defaults used when a script does not set them.
target_disease = Autism
train_bioprj = PRJNA516054
valid_bioprj = PRJNA516054
cv_bioprj = PRJNA516054

# Comma separated accessions / phenotypes to drop, or None.
exclude_bioprojects = None
exclude_phenotypes = None

[[hyperparams]]
max_epochs = 15
# Total batch size; divided evenly across the training processes.
batch_size = 64

# Encoder layers below this index are frozen. 0 = fine-tune everything,
# -1 = train the classification head only.
grad_start_layer = 0
# Encoder layer whose output feeds the classification head (-1 = last).
encoder_result_layer = -1

# geneformer | encoder | encoderWithgeneformer | geneformerMLP | encoderMLP
output_type = geneformer
# Hidden sizes of the MLP head; only used by the *MLP output types.
n_layers = 0
dense_act = GELU
cls_dropout_prob = 0.05

max_clip_grad_norm = 1.0
warmup_step_ratio = 0.1
# LinearWarmupDecay | CosineAnnealingWarmRestart | CyclicLR
scheduler_type = LinearWarmupDecay

# --------------------------------------------------------------------------
#  Encoder architecture -- must match the checkpoint above
# --------------------------------------------------------------------------
[Model]
[[hyperparams]]
hidden_size = 256
num_hidden_layers = 12
num_attention_heads = 4
intermediate_size = 512
hidden_act = gelu
hidden_dropout_prob = 0.1
attention_probs_dropout_prob = 0.1
max_position_embeddings = 460
type_vocab_size = 2
initializer_range = 0.02
model_bias = False

[Training]
[[hyperparams]]
learning_rate = 0.0005
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_weight_decay = 0.01
